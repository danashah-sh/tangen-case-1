<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Registrering - HobbyHub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    select {
      height: 80px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #cea8ea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #eac7df;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Registrer deg</h2>

  <form>
    <label for="navn">Navn:</label>
    <input type="text" id="navn" required>

    <label for="alder">Alder:</label>
    <input type="number" id="alder" min="16" required>

    <label for="interesser">Interesser:</label>
    <select id="interesser" multiple>
      <option>Brettspill</option>
      <option>Musikk</option>
      <option>Språk</option>
      <option>Sport</option>
      <option>Gaming</option>
    </select>

    <button type="submit">Registrer</button>
  </form>
</div>

</body>
</html>
